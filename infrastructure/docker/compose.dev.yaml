# Infraestructura local de desarrollo y pruebas de YEBO.
# Uso: pnpm infra:up  (requiere infrastructure/docker/.env, generado por scripts/dev/init-env.sh)
name: yebo-dev

services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PG_SUPERUSER_PASSWORD:?definir en infrastructure/docker/.env}
      POSTGRES_DB: postgres
      YEBO_OWNER_PASSWORD: ${PG_OWNER_PASSWORD:?}
      YEBO_APP_PASSWORD: ${PG_APP_PASSWORD:?}
      YEBO_PLATFORM_PASSWORD: ${PG_PLATFORM_PASSWORD:?}
      YEBO_IDENTITY_PASSWORD: ${PG_IDENTITY_PASSWORD:?}
      YEBO_BACKOFFICE_PASSWORD: ${PG_BACKOFFICE_PASSWORD:?}
      YEBO_METERING_PASSWORD: ${PG_METERING_PASSWORD:?}
      # Rol de PRUEBAS yebo_test_bypass (ADR-034): solo desarrollo y CI. Vacío = no se crea.
      YEBO_TEST_BYPASS_PASSWORD: ${TEST_PG_BYPASS_PASSWORD:-}
    ports:
      - '127.0.0.1:${PG_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d yebo_dev']
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4.6-alpine
    restart: unless-stopped
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:?}', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6380}:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 3s
      timeout: 3s
      retries: 30
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}

  # Almacenamiento de archivos compatible con S3 (Fase 5.2): logos e imágenes de los sitios. Solo en 127.0.0.1; la
  # API sirve los archivos públicos (el almacenamiento no se expone). Producción: el S3 del proveedor (D12).
  storage:
    image: dxflrs/garage:v2.5.0
    restart: unless-stopped
    command: ['/garage', 'server', '--single-node', '--default-bucket']
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?definir en infrastructure/docker/.env}
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY_ID:?}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:?}
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET:-yebo-assets}
    ports:
      - '127.0.0.1:${S3_PORT:-3900}:3900'
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garagemeta:/var/lib/garage/meta
      - garagedata:/var/lib/garage/data
    healthcheck:
      test: ['CMD', '/garage', 'bucket', 'info', '${S3_BUCKET:-yebo-assets}']
      interval: 3s
      timeout: 5s
      retries: 30

  # Modo HTTPS local (perfil `https`, no arranca con `infra:up`): Nginx termina TLS en <IP del servidor>:443 con el
  # certificado de scripts/dev/https-certs.sh y reenvía a las apps del host (127.0.0.1) por host.docker.internal
  # (válido en Docker Desktop y en Docker Engine gracias a host-gateway). Ver docs/development/https-local.md.
  https:
    image: nginx:1.28.3-alpine3.23
    profiles: ['https']
    restart: unless-stopped
    ports:
      - '${YEBO_HTTPS_IP:-127.0.0.1}:443:443'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      YEBO_HTTPS_IP: ${YEBO_HTTPS_IP:-}
      YEBO_BASE_DOMAIN: ${YEBO_BASE_DOMAIN:-}
      YEBO_BASE_DOMAIN_RE: ${YEBO_BASE_DOMAIN_RE:-}
    volumes:
      - ./https/templates:/etc/nginx/templates:ro
      - ./https/proxy.conf:/etc/nginx/snippets/yebo-proxy.conf:ro
      - ./https/certs/server.crt:/etc/nginx/certs/server.crt:ro
      - ./https/certs/server.key:/etc/nginx/certs/server.key:ro

volumes:
  pgdata:
  redisdata:
  garagemeta:
  garagedata:
